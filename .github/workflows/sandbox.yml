name: Sandbox integration tests

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 JST (Sunday at 21:00 UTC) to keep build caches warm.
    - cron: '0 21 * * 0'
  push:
    branches:
      - main
      - main2
    paths-ignore:
      - 'sandbox/docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'sandbox/docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: sandbox-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: sandbox

# This workflow tests the consumer project in sandbox against real Minecraft
# dependencies after checking the repository-root library build.
jobs:
  detect:
    name: Detect sandbox projects and test build logic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test library modules
        run: ../gradlew -p .. build --no-daemon --no-parallel --max-workers=1

      - name: Detect sandbox platform projects
        id: detect
        run: |
          chmod u+x ./gradlew
          ./gradlew --configuration-cache --no-daemon writeCiBuildMatrix
          JSON=$(<build/ci/build-matrix.json)
          echo "matrix=$(jq -c '.' <<< "$JSON")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<< "$JSON")" >> "$GITHUB_OUTPUT"
          echo "::group::Sandbox platform projects"
          jq . <<< "$JSON"
          echo "::endgroup::"

      - name: Test sandbox resource composition
        run: ./gradlew -p buildSrc test --configuration-cache --no-daemon --max-workers=1

  build:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    name: Sandbox (${{ matrix.subproject }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build sandbox Mod with real Minecraft dependencies
        run: chmod u+x ./gradlew && ./gradlew ":${{ matrix.subproject }}:build"

      - name: Upload sandbox Mod JARs
        uses: actions/upload-artifact@v7
        with:
          path: sandbox/${{ matrix.project_dir }}/build/libs/
          name: sandbox-${{ matrix.subproject }}

      # Fabric Game Tests are run implicitly by the build task.
      - name: Run sandbox NeoForge/Forge Game Tests
        if: ${{ matrix.run_game_test_server }}
        timeout-minutes: 10
        run: ./gradlew ":${{ matrix.subproject }}:runGameTestServer"

      - name: Verify sandbox server startup and shutdown
        if: ${{ matrix.run_server }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p "${{ matrix.project_dir }}/run"
          printf 'eula=true\n' > "${{ matrix.project_dir }}/run/eula.txt"
          printf 'online-mode=false\n' > "${{ matrix.project_dir }}/run/server.properties"
          server_log="${RUNNER_TEMP}/runServer-${{ matrix.subproject }}.log"
          printf 'stop\n' | ./gradlew ":${{ matrix.subproject }}:runServer" 2>&1 | tee "$server_log"
          grep -E '\[Server thread/INFO\].*Stopping server$' "$server_log"

      - name: Setup runtime JDK
        if: ${{ matrix.run_mc_runtime_test }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage sandbox Mod for client loading test
        if: ${{ matrix.run_mc_runtime_test }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/run/mods"
          main_artifact="${{ matrix.project_dir }}/build/libs/${{ matrix.main_artifact }}"
          test -f "$main_artifact"
          cp "$main_artifact" "$GITHUB_WORKSPACE/run/mods/"
          if [[ -d "${{ matrix.project_dir }}/build/ciRuntimeMods" ]]; then
            find "${{ matrix.project_dir }}/build/ciRuntimeMods" -maxdepth 1 -type f -name '*.jar' \
              -exec cp {} "$GITHUB_WORKSPACE/run/mods/" \;
          fi
          test -n "$(find "$GITHUB_WORKSPACE/run/mods" -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -la "$GITHUB_WORKSPACE/run/mods"

      - name: Verify sandbox Mod loads in Minecraft client
        if: ${{ matrix.run_mc_runtime_test }}
        timeout-minutes: 10
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.minecraft }}
          modloader: ${{ matrix.modloader }}
          regex: ${{ matrix.modloader_regex }}
          mc-runtime-test: ${{ matrix.mc_runtime_test }}
          java: ${{ matrix.java }}
          fabric-api: ${{ matrix.fabric_api }}
